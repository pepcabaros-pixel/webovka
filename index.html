<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moje AI Webovka</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1e1e24; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 90vh; margin: 0; }
        .chat-container { background: #2a2a35; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 100%; max-width: 500px; color: white; }
        h1 { font-size: 26px; color: #00f2fe; text-align: center; margin-top: 0; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 12px; border: none; background: #3f3f50; border-radius: 8px; color: white; font-size: 16px; }
        input:focus { outline: 2px solid #00f2fe; }
        button { padding: 12px 20px; border: none; background: #00f2fe; color: #1e1e24; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 16px; transition: 0.2s; }
        button:hover { background: #4facfe; transform: scale(1.02); }
        .output { padding: 15px; background: #333344; border-radius: 8px; min-height: 60px; white-space: pre-wrap; font-size: 15px; line-height: 1.5; border-left: 4px solid #00f2fe; }
    </style>
</head>
<body>

<div class="chat-container">
    <h1>Můj AI Pomocník</h1>
    <div class="input-group">
        <input type="text" id="userInput" placeholder="Zeptej se na cokoli...">
        <button onclick="askAI()">Odeslat</button>
    </div>
    <div class="output" id="aiOutput">Zde se objeví blesková odpověď od AI...</div>
</div>

<script>
async function askAI() {
    const input = document.getElementById('userInput').value;
    const outputDiv = document.getElementById('aiOutput');
    
    if (!input) return alert('Nejdřív něco napiš!');
    
    outputDiv.innerText = 'AI přemýšlí...';
    
    // SEM VLOŽ SVŮJ KLÍČ Z GROQ CONSOLE:
    const apiKey = "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"; 

    try {
        const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${apiKey}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                model: 'llama3-8b-8192', // Extrémně rychlý model od Mety
                messages: [{ role: 'user', content: input }]
            })
        });
        
        const data = await response.json();
        
        if (data.choices && data.choices[0]) {
            outputDiv.innerText = data.choices[0].message.content;
        } else {
            outputDiv.innerText = 'Chyba v odpovědi od AI. Zkontroluj svůj API klíč.';
        }
    } catch (error) {
        outputDiv.innerText = 'Chyba: Nepodařilo se odeslat dotaz.';
        console.error(error);
    }
}
</script>

</body>
</html>
